name: week1-node-monitor CI

on:
  push:
    branches: [main]
    paths:
      - "week-01/week1_node_monitor/**"
      - ".github/workflows/week1-node-monitor.yml"

defaults:
  run:
    working-directory: week-01/week1_node_monitor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ -v